<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPLADS Risk Intelligence &amp; Early Warning System</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="tricolor"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand">
      <svg class="emblem" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="24.5" fill="none" stroke="#93b4f8" stroke-width="1" opacity=".9"/>
        <g stroke="#1d4ed8" stroke-width="1.6">
          <line x1="32" y1="9" x2="32" y2="55"/><line x1="9" y1="32" x2="55" y2="32"/>
          <line x1="16" y1="16" x2="48" y2="48"/><line x1="48" y1="16" x2="16" y2="48"/>
          <line x1="32" y1="9" x2="32" y2="55" transform="rotate(22.5 32 32)"/>
          <line x1="32" y1="9" x2="32" y2="55" transform="rotate(67.5 32 32)"/>
          <line x1="32" y1="9" x2="32" y2="55" transform="rotate(112.5 32 32)"/>
          <line x1="32" y1="9" x2="32" y2="55" transform="rotate(157.5 32 32)"/>
        </g>
        <circle cx="32" cy="32" r="4.5" fill="#1d4ed8"/>
      </svg>
      <div class="side-title">MPLADS Risk Intelligence
        <span>&amp; Early Warning System</span></div>
    </div>

    <nav class="side-nav" id="side-nav">
      <button class="nav-item active" data-tab="dashboard">
        <svg class="nav-ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">Dashboard</span></button>
      <button class="nav-item" data-tab="alerts">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="nav-label">Alert Center</span></button>
      <button class="nav-item" data-tab="map">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="nav-label">GIS Risk Map</span></button>
      <button class="nav-item" data-tab="fundflow">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M7 7h13m0 0-3-3m3 3-3 3"/><path d="M17 17H4m0 0 3-3m-3 3 3 3"/></svg>
        <span class="nav-label">Fund Flow</span></button>
      <button class="nav-item" data-tab="duplicates">
        <svg class="nav-ico" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span class="nav-label">Duplicate Works</span></button>
      <button class="nav-item" data-tab="compliance">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="nav-label">Compliance Monitor</span></button>
      <button class="nav-item" data-tab="upload">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 20h16"/></svg>
        <span class="nav-label">Upload Your Data</span></button>
      <button class="nav-item" data-tab="feedback">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Feedback Log</span></button>
      <button class="nav-item" data-tab="about">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M12 6c-1.5-1.5-3.5-2-6-2v14c2.5 0 4.5.5 6 2 1.5-1.5 3.5-2 6-2V4c-2.5 0-4.5.5-6 2z"/><path d="M12 6v14"/></svg>
        <span class="nav-label">Methods</span></button>
    </nav>

    <div class="side-foot">
      <span class="date-chip" id="header-date"></span>
      <div id="system-health"></div>
    </div>
  </aside>

  <main>
    <section id="tab-dashboard" class="tab-panel"></section>
    <section id="tab-alerts" class="tab-panel hidden"></section>
    <section id="tab-map" class="tab-panel hidden"><div id="map"></div></section>
    <section id="tab-fundflow" class="tab-panel hidden"></section>
    <section id="tab-duplicates" class="tab-panel hidden"></section>
    <section id="tab-compliance" class="tab-panel hidden"></section>
    <section id="tab-upload" class="tab-panel hidden"></section>
    <section id="tab-feedback" class="tab-panel hidden"></section>
    <section id="tab-about" class="tab-panel hidden"></section>
  </main>
</div>

<div id="modal-root"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/plotly.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/alerts.js"></script>
<script src="js/gis.js"></script>
<script src="js/fundflow.js"></script>
<script src="js/duplicates.js"></script>
<script src="js/compliance.js"></script>
<script src="js/upload.js"></script>
<script src="js/feedback.js"></script>
<script src="js/about.js"></script>
<script src="js/app.js"></script>
</body>
</html>
